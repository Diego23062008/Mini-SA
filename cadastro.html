<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="./estilos/cadastro.css">
</head>
<body>
  <main>

    <section class="direita">
    <img src="./imagens/Gemini_Generated_Image_36o1b536o1b536o1-removebg-preview.png" alt="Logo">
  </section>
    <section class="esquerda">
      <div class="cadastro">
        <h1>Cadastro</h1>
        <form action="" method="POST">
          <div class="campo"><input type="text" name="nome" id="inome" placeholder="Nome Completo..." autocomplete="name"></div>
          <div class="campo"><input type="email" name="email" id="iemail" placeholder="Email..."></div>
          <div class="campo"><input type="number" name="telefone" id="itelefone" placeholder="Digite seu numero..."></div>
          <div class="campo"><input type="password" name="senha" id="isenha" placeholder="Digite sua Senha..."></div>
          <div class="campo"><input type="password" name="senha" id="iconfirmesenha" placeholder="Confirme sua Senha..."></div>
          <div class="btn_cadastro"><button>Cadastrar</button></div>
          <div class="possui_conta"><a href="#">Já possui uma conta?</a></div>
        </form>
      </div>
      
    </section>
    <script src="./javascript/cadastro.js"></script>
  </main>
</body>
</html>
